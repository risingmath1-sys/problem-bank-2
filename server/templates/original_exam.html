{% extends "base.html" %}
{% block title %}원본 출제 — 상승 Solution{% endblock %}
{% block content %}
<div class="space-y-4">
  <h1 class="text-2xl font-bold">📄 원본 출제</h1>

  <!-- 필터 -->
  <form id="orig-form"
        hx-get="/partial/original/files"
        hx-trigger="change delay:200ms, keyup delay:400ms from:input[type=text], load"
        hx-target="#orig-files"
        hx-swap="innerHTML"
        class="bg-slate-800 border border-slate-700 rounded-xl p-4 space-y-3">

    <div>
      <div class="text-sm font-semibold text-slate-300 mb-2">소스</div>
      <div id="orig-source-row" class="flex flex-wrap gap-2 text-sm">
        {% for code, label in sources %}
        <label class="cursor-pointer">
          <input type="radio" name="source" value="{{ code }}" class="peer sr-only orig-source-radio"
                 data-code="{{ code }}"
                 {% if loop.first %}checked{% endif %}
                 onchange="window.origToggleNaesinFields(this.value);">
          <span class="px-3 py-1 rounded border border-slate-600 peer-checked:bg-blue-600 peer-checked:border-blue-500 hover:bg-slate-700 transition">{{ label }}</span>
        </label>
        {% endfor %}
      </div>
    </div>

    <!-- 공통 필터 -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-2">
      <div>
        <label class="block text-xs text-slate-400 mb-1">파일명 검색</label>
        <input type="text" name="search"
               class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm focus:border-blue-500 outline-none">
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">년도</label>
        <select name="year"
                class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm focus:border-blue-500 outline-none">
          <option value="">전체</option>
          {% for y in all_years %}
          <option value="{{ y }}">{{ y }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="orig-naesin-only">
        <label class="block text-xs text-slate-400 mb-1">학교 (포함)</label>
        <input type="text" name="school"
               class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm focus:border-blue-500 outline-none">
      </div>
      <div class="orig-naesin-only">
        <label class="block text-xs text-slate-400 mb-1">단원명 (포함)</label>
        <input type="text" name="unit_like" placeholder="예: 미분"
               class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm focus:border-blue-500 outline-none">
      </div>
    </div>

    <!-- 내신 전용 필터 -->
    <div class="orig-naesin-only grid grid-cols-2 md:grid-cols-6 gap-2">
      <div>
        <label class="block text-xs text-slate-400 mb-1">학년</label>
        <select name="grade" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm">
          <option value=""></option>
          {% for v in ['고1','고2','고3','중1','중2','중3'] %}<option value="{{ v }}">{{ v }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">학기</label>
        <select name="semester" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm">
          <option value=""></option>
          <option value="1학기">1학기</option>
          <option value="2학기">2학기</option>
        </select>
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">시험</label>
        <select name="exam_type" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm">
          <option value=""></option>
          <option value="중간고사">중간고사</option>
          <option value="기말고사">기말고사</option>
        </select>
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">교육과정</label>
        <select name="curriculum" id="orig-curriculum"
                class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm"
                onchange="window.origRefreshSubjects(this.value);">
          <option value=""></option>
          {% for c in curriculum_names %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">과목</label>
        <select name="subject" id="orig-subject"
                class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm"
                onchange="window.origRefreshUnits(this.value);">
          <option value=""></option>
        </select>
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">난이도</label>
        <select name="diff_level" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm">
          <option value=""></option>
          <option value="최상">최상</option>
          <option value="상">상</option>
          <option value="중">중</option>
          <option value="하">하</option>
        </select>
      </div>
    </div>

    <!-- 시험범위 (단원 시작~끝) — 과목 선택 시만 활성 -->
    <div class="orig-naesin-only grid grid-cols-1 md:grid-cols-2 gap-2">
      <div>
        <label class="block text-xs text-slate-400 mb-1">시험범위 시작</label>
        <select name="unit_start" id="orig-unit-start" disabled
                class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm disabled:opacity-50">
          <option value=""></option>
        </select>
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">시험범위 끝</label>
        <select name="unit_end" id="orig-unit-end" disabled
                class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm disabled:opacity-50">
          <option value=""></option>
        </select>
      </div>
    </div>
  </form>

  <!-- 좌(파일) / 우(문제) -->
  <div class="grid grid-cols-1 lg:grid-cols-5 gap-4">
    <div id="orig-files" class="lg:col-span-2 bg-slate-800 border border-slate-700 rounded-xl p-4 min-h-[200px]">
      <div class="text-slate-500 text-sm">소스를 선택하면 파일 목록이 표시됩니다.</div>
    </div>
    <div id="orig-problems" class="lg:col-span-3 bg-slate-800 border border-slate-700 rounded-xl p-4 min-h-[200px]">
      <div class="text-slate-500 text-sm">왼쪽 파일을 클릭하면 문제 목록이 표시됩니다.</div>
    </div>
  </div>
</div>

<script>
(function () {
  const subjectsByCurriculum = {{ curriculums|tojson }};

  window.origRefreshSubjects = function (curr) {
    const subj = document.getElementById("orig-subject");
    if (!subj) return;
    const list = subjectsByCurriculum[curr] || [];
    const cur = subj.value;
    subj.innerHTML = '<option value=""></option>' + list.map(s => `<option value="${s}">${s}</option>`).join("");
    if (list.includes(cur)) subj.value = cur;
    window.origRefreshUnits(subj.value);
    htmx.trigger("#orig-form", "change");
  };

  window.origRefreshUnits = async function (subject) {
    const us = document.getElementById("orig-unit-start");
    const ue = document.getElementById("orig-unit-end");
    if (!us || !ue) return;
    if (!subject) {
      us.innerHTML = '<option value=""></option>';
      ue.innerHTML = '<option value=""></option>';
      us.disabled = true; ue.disabled = true;
      return;
    }
    try {
      const r = await fetch("/partial/original/units_for_subject?subject=" + encodeURIComponent(subject));
      const html = await r.text();
      us.innerHTML = html;
      ue.innerHTML = html;
      us.disabled = false; ue.disabled = false;
    } catch (e) { console.error(e); }
  };

  window.origToggleNaesinFields = function (sourceCode) {
    const isNaesin = sourceCode === "NAESIN_A" || sourceCode === "NAESIN_N";
    document.querySelectorAll(".orig-naesin-only").forEach(el => {
      el.style.display = isNaesin ? "" : "none";
    });
  };

  // 초기화
  const initSrc = document.querySelector(".orig-source-radio:checked");
  if (initSrc) window.origToggleNaesinFields(initSrc.value);
})();
</script>
{% endblock %}
