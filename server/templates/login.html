{% extends "base.html" %}
{% block title %}로그인 — 상승 Solution{% endblock %}
{% block content %}
<div class="min-h-[60vh] flex items-center justify-center">
  <div class="w-full max-w-sm bg-slate-800 rounded-xl p-8 shadow-xl border border-slate-700">
    <div class="flex flex-col items-center mb-6">
      <img src="/static/logo.png" alt="상승 Solution" class="h-20 w-20 mb-3">
      <h1 class="text-2xl font-bold text-blue-400">상승 Solution</h1>
      <p class="text-xs text-slate-500 mt-1">Problem Bank Management System</p>
    </div>
    <form hx-post="/api/auth/login" hx-target="#login-error" hx-swap="innerHTML" class="space-y-4">
      <div>
        <label class="block text-sm text-slate-400 mb-1">아이디</label>
        <input type="text" name="display_id" required
               class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 focus:border-blue-500 outline-none">
      </div>
      <div>
        <label class="block text-sm text-slate-400 mb-1">비밀번호</label>
        <input type="password" name="password" required
               class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 focus:border-blue-500 outline-none">
      </div>
      <div id="login-error" class="text-red-400 text-sm min-h-[1.25rem]"></div>
      <button type="submit"
              class="w-full bg-blue-600 hover:bg-blue-500 rounded py-2 font-medium transition">
        로그인
      </button>
    </form>
  </div>
</div>
{% endblock %}
