{% if total == 0 %}
  <div class="text-slate-500 text-sm">조건에 맞는 시험지가 없습니다.</div>
{% else %}
<div class="text-xs text-slate-400 mb-2">총 {{ total }}개</div>
<div class="space-y-3 max-h-[600px] overflow-y-auto pr-1">
  {% for group_name, files in groups.items() %}
  <div>
    <div class="text-xs font-semibold text-slate-300 mb-1 sticky top-0 bg-slate-800 py-1">{{ group_name }}</div>
    <ul class="space-y-1">
      {% for r in files %}
      <li>
        <button type="button"
                hx-get="/partial/original/problems?file_name={{ r.file_name|urlencode }}"
                hx-target="#orig-problems"
                hx-swap="innerHTML"
                class="w-full text-left bg-slate-900 hover:bg-slate-700 border border-slate-700 rounded px-3 py-2 text-sm transition">
          <div class="font-medium truncate">{{ r.file_name }}</div>
          <div class="text-xs text-slate-400">
            {% if r.year %}{{ r.year }}{% endif %}
            {% if r.semester %} · {{ r.semester }}{% endif %}
            {% if r.exam_type %} · {{ r.exam_type }}{% endif %}
            {% if r.subject %} · {{ r.subject }}{% endif %}
            <span class="text-blue-400 font-medium">· {{ r.problem_count }}문항</span>
            {% if r.diff_badge %}
            <span class="ml-1 px-1 rounded
              {% if r.diff_badge == '최상' %}bg-rose-700/40 text-rose-200
              {% elif r.diff_badge == '상' %}bg-orange-700/40 text-orange-200
              {% elif r.diff_badge == '중' %}bg-yellow-700/40 text-yellow-200
              {% else %}bg-emerald-700/40 text-emerald-200{% endif %}">
              {{ r.diff_badge }}{% if r.adv_score is defined %} ({{ r.adv_score }}점){% endif %}
            </span>
            {% endif %}
          </div>
          {% if r.units_concat %}
          <div class="text-xs text-slate-500 truncate mt-0.5">📚 {{ r.units_concat }}</div>
          {% endif %}
        </button>
      </li>
      {% endfor %}
    </ul>
  </div>
  {% endfor %}
</div>
{% endif %}
